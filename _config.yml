# The Site Configuration

theme: jekyll-theme-chirpy

# 한국어 블로그
lang: ko

# 한국 시간
timezone: Asia/Seoul

# =========================================================
# 기본 블로그 정보
# =========================================================

title: JISEOKBEOM

tagline: Backend Developer

description: >-
  Spring Boot와 Java를 중심으로 백엔드 개발 과정과
  프로젝트에서 경험한 문제 해결 과정을 기록합니다.

url: "https://jiseokbeom.github.io"

# =========================================================
# GitHub
# =========================================================

github:
  username: JISEOKBEOM

# Twitter/X를 사용하지 않으면 비워두기
twitter:
  username:

# =========================================================
# 작성자 정보
# =========================================================

social:
  name: JISEOKBEOM
  email:
  fediverse_handle:

  links:
    - https://github.com/JISEOKBEOM

# =========================================================
# 프로필 이미지
# =========================================================

# 이미지 파일을 assets/img/profile.png에 넣을 경우
avatar: /assets/img/profile.png

# SNS 공유 이미지
social_preview_image:

# =========================================================
# 화면 디자인
# =========================================================

# 밝은 테마로 고정
theme_mode: light

# =========================================================
# 목차
# =========================================================

toc: true

# =========================================================
# 댓글
# =========================================================

# 사용하지 않을 경우 비활성화
comments:
  provider:

# =========================================================
# Analytics
# =========================================================

analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

# =========================================================
# CDN
# =========================================================

cdn:

# =========================================================
# PWA
# =========================================================

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

# =========================================================
# Pagination
# =========================================================

paginate: 10

baseurl: ""

# =========================================================
# Markdown
# =========================================================

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# =========================================================
# Collections
# =========================================================

collections:
  tabs:
    output: true
    sort_by: order

# =========================================================
# 기본 Post 설정
# =========================================================

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# =========================================================
# Sass
# =========================================================

sass:
  style: compressed

# =========================================================
# HTML Compression
# =========================================================

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# =========================================================
# Build 제외 파일
# =========================================================

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

# =========================================================
# Archives
# =========================================================

jekyll-archives:
  enabled: [categories, tags]

  layouts:
    category: category
    tag: tag

  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
